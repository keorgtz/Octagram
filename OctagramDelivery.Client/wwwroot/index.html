<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OctagramDelivery</title>
    <base href="/" />

    <!-- 0. Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

    <!-- 1. MeridianUI tokens (primero siempre) -->
    <link rel="stylesheet" href="css/meridian.css" />

    <!-- 2. MudBlazor -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- 3. Override MudBlazor → MeridianUI (después de MudBlazor) -->
    <link rel="stylesheet" href="css/meridian-mud-overrides.css" />

    <!-- 4. App CSS -->
    <link rel="stylesheet" href="css/app.css" />
    <link href="OctagramDelivery.Client.styles.css" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#1976D2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
</head>

<body class="meridian-base">
    <div id="app">
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#F2F3F7;">
            <div style="text-align:center;">
                <div style="font-size:32px;font-weight:700;color:#1976D2;letter-spacing:-0.5px;">Octagram</div>
                <div style="font-size:13px;color:#6B7280;margin-top:4px;">Cargando...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#F44336;color:#fff;padding:8px 16px;z-index:9999;font-size:13px;">
        Ha ocurrido un error inesperado.
        <a href="." style="color:#fff;margin-left:8px;text-decoration:underline;">Recargar</a>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
