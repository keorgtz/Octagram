events {}

http {
    include mime.types;

    types {
        application/wasm wasm;
    }

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        root /usr/share/nginx/html;

        set $api http://torticloud-api:8080;

        # ── API proxy ────────────────────────────────────────────────
        location /api/ {
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── SignalR WebSocket ────────────────────────────────────────
        location /hubs/ {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # ── Service worker y manifest: NUNCA cachear ─────────────────
        # Cloudflare y el browser deben siempre pedir versión fresca
        location ~* (service-worker\.js|service-worker-assets\.js|manifest\.webmanifest) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # ── index.html: NUNCA cachear ────────────────────────────────
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ── Blazor _framework/: caché largo (nombres con hash) ───────
        # Estos archivos tienen hash en el nombre (ej: app.7estppejn8.wasm)
        # Son inmutables: cuando el contenido cambia, cambia la URL
        location /_framework/ {
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # ── App CSS, JS sin hash y otros estáticos: revalidar siempre ─
        # app.css NO tiene hash en el nombre, Cloudflare NO debe cachearlo
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache";
            add_header Pragma "no-cache";
            try_files $uri =404;
        }

        # ── Imágenes y fuentes: caché moderado ───────────────────────
        location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=604800";
        }

        # ── SPA fallback ─────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}
