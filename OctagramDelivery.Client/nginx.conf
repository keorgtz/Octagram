events {}

http {
    include mime.types;

    types {
        application/wasm wasm;
    }

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        root /usr/share/nginx/html;

        set $api http://torticloud-api:8080;

        # ── API proxy ────────────────────────────────────────────────
        location /api/ {
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── SignalR WebSocket ────────────────────────────────────────
        location /hubs/ {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # ── NUNCA cachear: service worker + assets manifest + index ──
        # Sin esto el navegador cachea el SW viejo y nunca ve cambios
        location ~* (service-worker\.js|service-worker-assets\.js) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ── Assets con hash de contenido: caché agresivo (1 año) ────
        # Blazor genera nombres únicos por contenido (.7estppejn8.wasm etc.)
        # Es seguro cachearlos indefinidamente
        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA fallback ─────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}
