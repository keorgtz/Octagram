<body class="meridian-base">
    <div id="app">
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#F2F3F7;">

        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#F44336;color:#fff;padding:8px 16px;z-index:9999;font-size:13px;">

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
    <script>
        window.offlineSync = {
            _ref: null,
            init: function (ref) {
                this._ref = ref;
                window.addEventListener('online',  () => { if (this._ref) this._ref.invokeMethodAsync('NotifyOnline'); });
                window.addEventListener('offline', () => { if (this._ref) this._ref.invokeMethodAsync('NotifyOffline'); });
            },
            isOnline: function () { return navigator.onLine; }
        };
    </script>
